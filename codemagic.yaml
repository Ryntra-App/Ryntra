workflows:
  android-native:
    name: Rinthy Android Native
    max_build_duration: 60
    environment:
      java: 21
    scripts:
      - name: Test shared logic
        script: ./gradlew :shared:testAndroidHostTest
      - name: Build Android debug APK
        script: ./gradlew :androidApp:assembleDebug
    artifacts:
      - androidApp/build/outputs/apk/debug/*.apk

  ios-native:
    name: Rinthy iOS Native
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      java: 21
    scripts:
      - name: Build iOS simulator app
        script: >-
          xcodebuild -project iosApp/Rinthy.xcodeproj -scheme Rinthy
          -sdk iphonesimulator -configuration Debug
          CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
