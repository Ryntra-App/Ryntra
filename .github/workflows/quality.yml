name: Native quality

on:
  pull_request:
  push:
    branches: [main, native/kmp-rewrite]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate localizations
        run: python tools/localization.py check
      - name: Test shared logic and build Android
        run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug --stacktrace

  ios-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build iOS app
        run: >-
          xcodebuild
          -project iosApp/Ryntra.xcodeproj
          -scheme Ryntra
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
