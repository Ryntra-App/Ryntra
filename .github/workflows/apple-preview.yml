name: Apple builds

# Manual builds made without a Mac: an iOS simulator app zipped for Appetize,
# plus the unsigned IPA and macOS DMG that go on a GitHub release, all kept as
# run artifacts. The runner must carry Xcode 26: an app built against an older
# SDK keeps the pre-26 look on iOS 26 instead of Liquid Glass.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RYNTRA_BACKEND_URL: https://authrinthy.sawiq.org

jobs:
  ios-simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build iOS simulator app
        # x86_64 is the slice Appetize runs
        run: >-
          xcodebuild
          -project iosApp/Ryntra.xcodeproj
          -scheme Ryntra
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios-simulator
          ARCHS=x86_64
          ONLY_ACTIVE_ARCH=NO
          RYNTRA_BACKEND_URL="$RYNTRA_BACKEND_URL"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package for Appetize
        run: |
          APP_PATH=build/ios-simulator/Build/Products/Release-iphonesimulator/Ryntra.app
          lipo "$APP_PATH/Ryntra" -verify_arch x86_64
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/Ryntra-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Ryntra-ios-simulator
          path: dist/Ryntra-simulator.zip
          retention-days: 14

  ios-device:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build unsigned iPhone app
        run: >-
          xcodebuild
          -project iosApp/Ryntra.xcodeproj
          -scheme Ryntra
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/ios
          RYNTRA_BACKEND_URL="$RYNTRA_BACKEND_URL"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
      - name: Package unsigned IPA
        run: |
          APP_PATH=build/ios/Build/Products/Release-iphoneos/Ryntra.app
          # Vision Pro only accepts this build because it declares iPad support
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$APP_PATH/Info.plist" | grep -q 2
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          mkdir -p build/ipa/Payload dist
          ditto "$APP_PATH" build/ipa/Payload/Ryntra.app
          (cd build/ipa && /usr/bin/zip -qry "../../dist/Ryntra.$VERSION.ipa" Payload)
      - uses: actions/upload-artifact@v7
        with:
          name: Ryntra-ios-ipa
          path: dist/*.ipa
          retention-days: 14

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build macOS app
        # arm64 only: Kotlin/Native has no Intel macOS slice for the shared framework
        run: >-
          xcodebuild
          -project iosApp/Ryntra.xcodeproj
          -scheme Ryntra
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath build/macos
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=NO
          RYNTRA_BACKEND_URL="$RYNTRA_BACKEND_URL"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package macOS DMG
        run: |
          APP_PATH=build/macos/Build/Products/Release/Ryntra.app
          # The Kotlin framework is linked dynamically; the app cannot launch without it
          test -d "$APP_PATH/Contents/Frameworks/RyntraShared.framework"
          lipo "$APP_PATH/Contents/MacOS/Ryntra" -verify_arch arm64
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          STAGING="$(mktemp -d)"
          ditto "$APP_PATH" "$STAGING/Ryntra.app"
          ln -s /Applications "$STAGING/Applications"
          mkdir -p dist
          hdiutil create -volname Ryntra -srcfolder "$STAGING" -format UDZO -ov "dist/Ryntra.$VERSION.dmg"
          hdiutil verify "dist/Ryntra.$VERSION.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: Ryntra-macOS
          path: dist/*.dmg
          retention-days: 14
